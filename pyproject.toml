[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cookie-audit"
version = "0.1.0"
description = "Cookie security analyzer: audits Set-Cookie headers for missing Secure/HttpOnly/SameSite, prefix-rule violations, over-long lifetimes, and risky scopes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Priyanshu Kumar Thakur" },
]
maintainers = [
    { name = "Priyanshu Kumar Thakur", email = "gravion-ux@users.noreply.github.com" }
]
keywords = ["cookies", "security", "http", "set-cookie", "auditing", "web-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Runtime dependencies: none. cookie-audit uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cookie-audit = "cookie_audit.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/cookie-audit"
Repository = "https://github.com/gravion-ux/cookie-audit"
Issues = "https://github.com/gravion-ux/cookie-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
